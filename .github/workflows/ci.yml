name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests with coverage
        run: uv run coverage run -m pytest

      - name: Generate and publish coverage badge
        if: github.event_name == 'push'
        run: |
          uv run coverage-badge -o /tmp/coverage.svg -f
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git reset --hard --quiet
          if git ls-remote --exit-code origin badges; then
            git checkout -B badges origin/badges
          else
            git checkout --orphan badges
            git rm -rf . --quiet
          fi
          cp /tmp/coverage.svg coverage.svg
          git add coverage.svg
          git diff --staged --quiet || git commit -m "chore: update coverage badge"
          git push origin badges

  package:
    # Build the distribution and test the installed wheel from outside the checkout, as users get it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      - name: Install the wheel in a clean environment (CPU PyTorch first, as in the README)
        run: |
          uv venv /tmp/venv --python 3.11
          uv pip install --python /tmp/venv/bin/python torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python /tmp/venv/bin/python dist/*.whl

      - name: Import and run a constrained prediction
        run: |
          cp .github/scripts/smoke_test.py /tmp/smoke_test.py
          cd /tmp && /tmp/venv/bin/python smoke_test.py
